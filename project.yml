name: Lumen

options:
  bundleIdPrefix: com.lumen
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    # Unsigned CI builds. AltStore re-signs the .ipa with your free Apple ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.app
        PRODUCT_NAME: Lumen
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: >-
          Lumen uses the camera so you can shoot with manual shutter speed, ISO,
          focus and white balance.
        NSPhotoLibraryAddUsageDescription: >-
          Lumen saves the photos you capture and edit to your photo library.
        NSPhotoLibraryUsageDescription: >-
          Lumen opens photos from your library so you can edit them.

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    run:
      config: Debug
    archive:
      config: Release
